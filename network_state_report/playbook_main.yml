---
# This playbook creates tables of the state of different elements within the network

- name: "Create file structure"
  hosts: localhost
  tasks:
    # 1. Create the environment to save dynamically created files to
    - name: BLK >> Create file structure
      check_mode: false
      tags: report
      block:
        - name: SYS >> Deleting old temporary table directory # noqa: no-free-form
          ansible.builtin.file: path="{{ tmp_path }}" state=absent
          changed_when: false
        - name: SYS >> Creating temporary table directory # noqa: risky-file-permissions
          ansible.builtin.file:
            path: "{{ tmp_path }}"
            state: directory
          changed_when: false

# 2. Run all the plays to gather output
- name: "Gather BGP output"
  hosts: nxos:router
  roles:
    - bgp
- name: "Gather Edge output"
  hosts: router:firewall
  roles:
    - edge
- name: "Gather interface outputs"
  hosts: switch:router:firewall
  roles:
    - interfaces
- name: "Gather L2 table outputs"
  hosts: dmz:leaf
  roles:
    - l2

- name: "Gather L3 tables and OSPF outputs"
  hosts: router:firewall:nxos
  roles:
    - l3
    - ospf

- name: "Gather VIP outputs"
  hosts: ltm
  roles:
    - vips

# 3. Create tables from all the gathered outout
- name: "Create Tables"
  hosts: localhost
  roles:
    - report
  # 4. Create a date fact (variable) and join tables in a time-stamped report
  tasks:
    - name: SYS >> Creating report from generated tables
      ansible.builtin.assemble:
        src: "{{ tmp_path }}"
        dest: "{{ dir_path }}/network_state_{{ lookup('pipe', 'date +%Y-%m-%d_%H%M') }}.txt"
      changed_when: false
      tags: report
  check_mode: false
