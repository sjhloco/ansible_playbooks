---
- name: BLK >> Collect BIG-IP facts
  tags: [vip]
  block:
    - name: NET >> Collecting BIG-IP facts
      # Not been tested since rework
      f5networks.f5_modules.bigip_device_info:
        gather_subset:
          - virtual-servers
          - ltm-pools
        provider: "{{ creds_big_ip }}"
      register: vips_output
      delegate_to: localhost

    - name: "SYS >> Passing through Python Filter"
      ansible.builtin.set_fact: # Passes output through filter
        vips_table: "{{ vips_output | vip_filter(inventory_hostname) }}"
      changed_when: false

# Creates localhost_fact that is a list of all other host_facts (lists)
- name: "SYS >> Creating nested list of all outputs"
  ansible.builtin.set_fact:
    vips_list_table: "{{ ansible_play_hosts | map('extract', hostvars, 'vips_table') | list }}"
  run_once: true
  delegate_to: localhost
  delegate_facts: true # What makes it a localhost_fact
  tags: [vip]
