---
- name: BLK >> Gather NXOS output
  tags: [bgp]
  when: ansible_network_os == 'cisco.nxos.nxos'
  block:
    - name: "NET >> Gather NXOS output"
      napalm.napalm.napalm_get_facts:
        dev_os: "{{ ansible_network_os.split('.')[-1] }}"
        filter:
          - "bgp_neighbors"
      register: bgp_output
    - name: "SYS >> Pass through Python Filter"
      ansible.builtin.set_fact: # Passes output through filter with bgp_neigh variable
        bgp_table: "{{ bgp_output.ansible_facts | bgp_filter(inventory_hostname, bgp_neigh) }}"
      changed_when: false

# NAPALM get_bgp_neighbors doesn't work with csr1000v so used PYATS instead
- name: "BLK >> Get IOSXE output"
  tags: [bgp]
  when: ansible_network_os == 'cisco.ios.ios'
  block:
    - name: "NET >> Gather IOSXE output"
      ansible.utils.cli_parse:
        command: show bgp all summary
        parser:
          name: ansible.netcommon.pyats
          os: iosxe
        set_fact: bgp_output
    - name: "SYS >> Pass through Python Filter"
      ansible.builtin.set_fact: # Passes output through filter with bgp_neigh variable
        bgp_table: "{{ ansible_facts.bgp_output | csr_bgp_filter(inventory_hostname, bgp_neigh) }}"
      changed_when: false

# Creates localhost_fact that is a list of all other host_facts (lists)
- name: "SYS >> Creating nested list of all outputs"
  ansible.builtin.set_fact:
    bgp_list_table: "{{ ansible_play_hosts | map('extract', hostvars, 'bgp_table') | list }}"
  run_once: true
  delegate_to: localhost
  delegate_facts: true # What makes it a localhost_fact
  tags: [bgp]
