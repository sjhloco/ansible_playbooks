---
- name: BLK >> Gathering all outputs
  tags: [edge]
  block:
    - name: "NET >> Gathering all outputs"
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ edge_cmds }}" # Loops cmds from group_vars
      register: edge_output

    - name: "SYS >> Passing through Python Filter" # Filter needs a dict of {command: raw output}
      ansible.builtin.set_fact:
        edge_table: >-
          {{ dict(edge_output.results | map(attribute='item')
          | zip(edge_output.results | map(attribute='stdout')))
          | edge_filter(inventory_hostname, ansible_network_os.split('.')[-1], vpn_peer) }}
      changed_when: false

# Creates localhost_fact that is a list of all other host_facts (lists)
- name: "SYS >> Creating nested list of all outputs"
  ansible.builtin.set_fact:
    edge_list_table: "{{ ansible_play_hosts | map('extract', hostvars, 'edge_table') | list }}"
  run_once: true
  delegate_to: localhost
  delegate_facts: true # What makes it a localhost_fact
  tags: [edge]
