- name: BLK >> Gathering all outputs
  tags: [intf]
  block:
    - name: "NET >> Gathering all outputs"
      napalm.napalm.napalm_get_facts:
        dev_os: "{{ ansible_network_os.split('.')[-1] }}"
        filter: "{{ item }}"
      register: interfaces_output
      loop: "{{ itf_cmds }}"

    # Used a loop as asa as it cant take the lldp filter
    - name: "SYS >> Passing through Python Filter"
      ansible.builtin.set_fact: # Passes output through filter
        # interface_table: "{{ itf_output.results[0].ansible_facts | itf_filter(inventory_hostname) }}"
        interfaces_table: "{{ interfaces_output.results | itf_filter(inventory_hostname) }}"
      changed_when: false

# Creates localhost_fact that is a list of all other host_facts (lists)
- name: "SYS >> Creating nested list of all outputs"
  ansible.builtin.set_fact:
    interfaces_list_table: "{{ ansible_play_hosts | map('extract', hostvars, 'interfaces_table') | list }}"
  run_once: true
  delegate_to: localhost
  delegate_facts: true # What makes it a localhost_fact
  tags: [intf]
