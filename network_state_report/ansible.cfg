# Check what is applied:  uv run ansible-config dump --only-changed
[defaults]
#### LOCATION ####
inventory = hosts.yml
# collections_path = collections
# roles_path = ./roles
filter_plugins = plugins/filter
## You also need to enable logging [persistent_connection] >> log_messages
log_path=ansible.log
## To hardcode path to vault file (secret that decrypts passwords), better to use ANSIBLE_VAULT_PASSWORD_FILE
# vault_password_file = ~/vault_pass_file      # To hardcode path to vault file

#### SETTINGS - END HOSTS #### 
gathering = explicit
## Set to True for production kit
host_key_checking = False    
## default user and become are meant to be for linux hosts, network devices set in group_vars
remote_user = ste
become_method = sudo

forks = 10

#### PRINTOUT ####
## Using YAML (default JSON) means -v and error are printed in better format (not squashed 1 line JSON)
callback_result_format = yaml
## Less printout noise, although use display_ok_hosts selectively as wont show any ok such as debug, assert, etc
display_skipped_hosts = False
# display_ok_hosts = false
## Prints the file and line number of a failed task (useful when importing files into playbooks)
show_task_path_on_failure = true
## Only prints tasks with tags: [print_action], default is (ansible.builtin.default)
# stdout_callback = community.general.selective  

#### DEBUG ####
# Similar to python debugger, stops if fails and can print vars, etc (can use at playtime ANSIBLE_ENABLE_TASK_DEBUGGER=True)
# enable_task_debugger = True


#### TEMP ####
## The default flips to False in 2.24, so may as well start now
inject_facts_as_vars = False


[persistent_connection]
## ansible-pylibssh SSH library for network_cli. is hard to build on macOS
ssh_type = paramiko

## Raise (default 30) for slow devices (persistent conn remain idle) or long show commands (time wait for response)
# connect_timeout = 30
# command_timeout = 30

## To enable logging, can do per-play with "vars: ansible_persistent_log_messages: True"
# log_messages = True

