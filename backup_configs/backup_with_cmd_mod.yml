---
# This playbook backs up the device configurations to a remote git repo
- name: "Creating file structure"
  hosts: localhost
  tasks:
    # Create a date fact (variable) to be used in the name stored config file
    - name: SYS >> Get ansible date/time facts
      setup:
        filter: "ansible_date_time"
    - name: SYS >> Store Date in a Fact
      set_fact:
        DATE: "{{ ansible_facts.date_time.date }}"

    # Clone a remote repo to save the config output in
    - name: GIT >> Clone private repo into /tmp
      git:
        repo: https://github.com/sjhloco/ansible_playbooks.git
        version: master
        dest: /tmp/network_backups
        single_branch: true # Clone just one branch
        depth: 1

# Create copy of IOS running config and save to file in /tmp
- name: "Backing up IOS Devices"
  hosts: ios
  tasks:
    - name: "NET >> Backup ios running configs"
      cisco.ios.ios_command:
        commands: "{{ commands }}"
      register: CLI_OUTPUT
    - name: SYS >> Save output to backup dir
      copy:
        content: "{{ CLI_OUTPUT.stdout[0] }}"
        dest: "/tmp/ansible_playbooks/backup_configs/configs/{{ inventory_hostname }}_{{hostvars.localhost.DATE}}.cfg"
