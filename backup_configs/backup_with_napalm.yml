# Commit and push changes to it and cleanup file directory
- name: Push config backups to git and cleanup
  hosts: localhost
  tasks:
    # First check if anything has changed
    - name: GIT >> Check for changes
      ansible.builtin.command:
        cmd: git status --porcelain
        chdir: "{{ repo_path }}"
      register: git_status
      changed_when: false # So play doesn't never marks task as changed
    # If changed then commit and push changes to the repo
    - name: GIT >> Commit and push backups
      when: git_status.stdout | length > 0
      block:
        - name: GIT >> Stage changes
          ansible.builtin.command:
            cmd: git add --all
            chdir: "{{ repo_path }}"
        - name: GIT >> Commit
          ansible.builtin.command:
            cmd: git commit -m "Config backups by Ansible {{ hostvars.localhost.DATE }}"
            chdir: "{{ repo_path }}"
          environment:
            GIT_AUTHOR_NAME: Ansible
            GIT_AUTHOR_EMAIL: ansible@lab.local
            GIT_COMMITTER_NAME: Ansible
            GIT_COMMITTER_EMAIL: ansible@lab.local
        - name: GIT >> Push
          ansible.builtin.command:
            cmd: git push origin HEAD
            chdir: "{{ repo_path }}"

    # Cleanup the directory
    - name: "SYS >> Delete the directory"
      file:
        path: "{{ repo_path }}"
        state: absent
