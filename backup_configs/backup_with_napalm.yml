---
# This playbook backs up the device configurations to a remote git repo
- name: "Creating file structure"
  hosts: localhost
  tasks:
    # Create a date fact (variable) to be used in the GIT message
    - name: SYS >> Get ansible date/time facts
      setup:
        filter: "ansible_date_time"
    - name: SYS >> Store Date in a Fact
      set_fact:
        DATE: "{{ ansible_facts.date_time.date }}"
    # Clone a remote repo to save the config output in
    - name: GIT >> Clone private repo into /tmp
      git:
        repo: "{{ git_repo }}"
        version: master
        dest: "{{ repo_path }}"
        single_branch: true # Clone just one branch
        depth: 1

# Create copy of Cisco running configs
- name: "Backing up Devices with NAPALM"
  hosts: router:switch:firewall
  tasks:
    - name: "NET >> Backup Cisco running configs"
      napalm.napalm.napalm_get_facts:
        filter:
          - "config"
      tags: [print_action]
    # Save the configs to file in /tmp
    - name: SYS >> Save output to backup dir
      copy:
        content: "{{ ansible_facts.napalm_config.running }}" # nested ansible fact
        dest: "{{ repo_path }}/backup_configs/configs/{{ inventory_hostname }}.cfg"
      delegate_to: localhost

