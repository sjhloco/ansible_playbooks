---
# Saves all Ansible variables/facts, one file all each commands

# Creates an empty file structure by first deleting then creating directories
- name: "SYS >> Create the file structure"
  hosts: localhost
  tasks:
    - ansible.builtin.file: path="/tmp/results" state=absent # noqa: name[missing] no-free-form
    - ansible.builtin.file: path="/tmp/results" state=directory # noqa: name[missing] no-free-form risky-file-permissions

# Runs show cmds using list of cmds from group_vars
- name: Run commands
  hosts: router # Runs on all hosts in cisco or asa group
  tasks:
    - name: "NET >> Run device show cmds"
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ commands }}"
      register: cli_output
    # Uses jinja2 template to create one file of all outputs on a per-host basis
    - name: "NET >> Save Host Outputs"
      ansible.builtin.template: # noqa: risky-file-permissions
        src: ios_outputs.j2
        dest: "/tmp/results/{{ inventory_hostname }}.cfg"
      delegate_to: localhost
